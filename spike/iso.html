<script>
const Q = new URLSearchParams(location.search);
const num = (k, d) => Q.get(k) === null ? d : +Q.get(k);
start(Q.get('mode') || 'story');
scene = 'play';
pl.shards = num('shards', 0);
pl.hp = num('hp', 3);
cb = num('cb', 0);
