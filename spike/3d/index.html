<title>Rainbow Unicorn — 3D spike on the 2025 engine</title>
<style>
  html,body{margin:0;height:100%;background:#0e0b1e;overflow:hidden;font:13px system-ui;color:#fff}
  canvas{position:absolute;top:0;left:0}
  #c{width:100vw;height:100vh}   /* stretched, and it must receive the pointer */
  #hint{position:fixed;bottom:6px;left:10px;color:#ffffff55;font:11px system-ui}
</style>
<canvas id=c3></canvas>
<script>
// Headless software GL refuses a WebGL context when the page holds two canvas
// elements, so ?nohud keeps the HUD canvas out of the DOM. The game still gets
// it through getElementById, which is the only way it asks for one.
const NOHUD = location.search.includes('nohud');
const hudCanvas = document.createElement('canvas');
hudCanvas.id = 'c'; hudCanvas.width = 960; hudCanvas.height = 564;
if (!NOHUD) document.body.appendChild(hudCanvas);
const _gid = document.getElementById.bind(document);
document.getElementById = id => id === 'c' ? hudCanvas : _gid(id);
</script>
<div id=hint>3D spike &mdash; 2026 gameplay, 2025 renderer. WASD, mouse to throw, shift to gallop.</div>
