<!doctype html>
<meta charset="utf-8">
<title>debug — jump to any room</title>
<style>
  html,body{margin:0;height:100%;background:#0e0b1e;display:grid;place-items:center;
            font:13px system-ui;color:#fff;overflow:hidden}
  canvas{background:#1a1633;max-width:100vw;max-height:100vh;touch-action:none;cursor:crosshair}
  #hint{position:fixed;bottom:8px;left:12px;color:#ffffff66;font:12px system-ui}
</style>
<canvas id=c width=960 height=564></canvas>
<div id=hint></div>
  <script src="../src/core.js"></script>
  <script src="../src/rooms.js"></script>
  <script src="../src/generate.js"></script>
  <script src="../src/state.js"></script>
  <script src="../src/audio.js"></script>
  <script src="../src/fx.js"></script>
  <script src="../src/input.js"></script>
  <script src="../src/tiles.js"></script>
  <script src="../src/light.js"></script>
  <script src="../src/storm.js"></script>
  <script src="../src/update.js"></script>
  <script src="../src/draw.js"></script>
  <script src="../src/ui.js"></script>
  <script src="../src/main.js"></script>
<script>
// Dev harness: boots the real game and drops you into any room with whatever
// you need, so a dark room or the boss is one URL away instead of a playthrough.
//
//   ?room=9              index into the room list printed below
//   ?prism=1             carry the horn, charged (prism=2 for two splits left)
//   ?shards=7            colours in hand      ?sig=1  all sun sigils lit
//   ?hp=3  ?cb=1         hearts, colourblind pips
//   ?mode=random&seed=7  a generated run instead of the story
//
// [ and ] step through rooms. This page skips the intro card on purpose.
const Q = new URLSearchParams(location.search);
const num = (k, d) => Q.get(k) === null ? d : +Q.get(k);

start(Q.get('mode') || 'story');
if (Q.get('seed')) { seed = +Q.get('seed'); DUN = gen(seed, 7 + seed % 4); shardGoal = DUN.goal; newGame(); }
scene = 'play';                                   // straight into the room

const kit = () => {
  pl.shards = num('shards', 0);
  pl.hp = num('hp', 3);
  cb = num('cb', 0);
  const p = num('prism', 0);
  pl.prism = p ? 1 : 0;
  pl.pch = p ? Math.min(PMAX, p === 1 ? PMAX : p) : 0;   // prism=1 means fully charged
  if (num('sig', 0)) { sig = sigNeed; rooms.forEach(r => r.m.forEach((row, y) =>
    [...row].forEach((t, x) => { if (t === 'S') r.lit.add(x + ',' + y); }))); }
};

const go = n => {
  cur = (n + SRC.length) % SRC.length;
  enter(cur, 60, 262);
  kit();                                          // enter() can respawn things, so re-kit after
  hint.textContent = `[${cur}] ${SRC[cur].name}   drain ${room.drain}   horn ${pl.pch}/${PMAX}`
    + `   sigils ${sig}/${sigNeed}   ·   [ ] to change room   ·   ${SRC.map((r, i) => i + ':' + r.name).join('  ')}`;
};
let cur = 0;
go(num('room', 5));
addEventListener('keydown', e => {
  if (e.key === '[') go(cur - 1);
  if (e.key === ']') go(cur + 1);
});
</script>
